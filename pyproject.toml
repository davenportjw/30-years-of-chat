[project]
name = "agents-of-chat-e2e-tests"
version = "0.1.0"
description = "End-to-End integration test suite for Agents of Chat deployed on Cloud Run"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
